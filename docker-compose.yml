services:
  metabase:
    # Pinned to the version the suite is verified against; override with MB_IMAGE
    # (e.g. MB_IMAGE=metabase/metabase:latest) to test another release.
    image: ${MB_IMAGE:-metabase/metabase:v0.64.3.4}
    ports:
      - "3000:3000"
    environment:
      MB_TRANSFORMS_ENABLED: "true"
    depends_on:
      - postgres
    healthcheck:
      test: curl -f http://localhost:3000/api/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # "Test Warehouse" for transform and CSV upload tests (the sample DB can't do either).
  # tests/setup.ts registers it in Metabase; Metabase reaches it as host "postgres".
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
