name: Tests
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays: check drift against metabase:latest
  workflow_dispatch:

jobs:
  test:
    name: test (pinned Metabase)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bunx tsc --noEmit -p .
      - name: README tool tables match the registry
        run: bun run docs:check
      - name: Version fields agree (package.json, server-info, server.json, mcpb manifest)
        run: bun run version:check
      - run: docker compose up -d
      - run: ./tests/ci/wait-for-metabase.sh
      - run: bun test
        env:
          MB_TEST_PG_HOST: postgres
      - run: docker compose down
        if: always()

  test-latest:
    # Non-blocking: shows when a new Metabase release breaks us before we bump the pin
    name: test (metabase:latest, non-blocking)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      MB_IMAGE: metabase/metabase:latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: docker compose up -d
      - run: ./tests/ci/wait-for-metabase.sh
      - name: Metabase version
        run: curl -s http://localhost:3000/api/session/properties | jq -c .version
      - run: bun test
        env:
          MB_TEST_PG_HOST: postgres
      - run: docker compose down
        if: always()
