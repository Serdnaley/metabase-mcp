name: Release
# One GitHub release (tag vX.Y.Z) publishes everywhere:
#   npm (OIDC trusted publishing) → official MCP Registry (OIDC)
#   .mcpb bundle → GitHub release asset → Smithery (only if SMITHERY_API_KEY is set)
#   Docker image → ghcr.io/serdnaley/metabase-mcp
# Every publish step skips what is already published, so the whole workflow can be re-run
# for a tag with "Run workflow" (workflow_dispatch) after fixing a failed job.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)publish, e.g. v0.3.0"
        required: true

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  NPM_PACKAGE: "@serdnaley/metabase-mcp"
  MCP_NAME: io.github.Serdnaley/metabase-mcp
  MCP_PUBLISHER_VERSION: v1.8.4
  MCPB_CLI: "@anthropic-ai/mcpb@2.1.2"
  SMITHERY_CLI: smithery@1.2.0

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Tag matches every version field
        run: bun run scripts/version.ts check "$TAG"
      - run: bunx tsc --noEmit -p .
      - run: bun run docs:check
      - run: docker compose up -d  # pinned Metabase from docker-compose.yml
      - run: ./tests/ci/wait-for-metabase.sh
      - run: bun test
        env:
          MB_TEST_PG_HOST: postgres
      - run: docker compose down
        if: always()

  npm:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install
      - run: bun run build
      - name: Publish to npm (skip if this version exists)
        run: |
          set -euo pipefail
          V="${TAG#v}"
          if npm view "$NPM_PACKAGE@$V" version >/dev/null 2>&1; then
            echo "::notice::$NPM_PACKAGE@$V is already on npm, skipping"
          else
            npm publish --provenance --access public
          fi

  mcp-registry:
    needs: npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Wait until npm serves the new version with mcpName
        run: |
          set -euo pipefail
          V="${TAG#v}"
          for i in $(seq 1 30); do
            got="$(npm view "$NPM_PACKAGE@$V" mcpName 2>/dev/null || true)"
            if [ "$got" = "$MCP_NAME" ]; then echo "npm has $V with mcpName"; exit 0; fi
            echo "waiting for npm ($i/30)…"; sleep 10
          done
          echo "::error::npm does not show $NPM_PACKAGE@$V with mcpName=$MCP_NAME"; exit 1
      - name: Skip if this version is already in the registry
        id: exists
        run: |
          V="${TAG#v}"
          name_enc="$(jq -rn --arg s "$MCP_NAME" '$s|@uri')"
          code="$(curl -s -o /dev/null -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0/servers/$name_enc/versions/$V")"
          echo "registry answered $code"
          if [ "$code" = "200" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; echo "::notice::$MCP_NAME $V already published"; fi
      - name: Install cosign
        if: steps.exists.outputs.skip != 'true'
        uses: sigstore/cosign-installer@v3
      - name: Download and verify mcp-publisher
        if: steps.exists.outputs.skip != 'true'
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o "$archive" "$base_url/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Check server.json version
        if: steps.exists.outputs.skip != 'true'
        run: |
          V="${TAG#v}"
          test "$(jq -r .version server.json)" = "$V"
          test "$(jq -r '.packages[0].version' server.json)" = "$V"
      - name: Publish to the MCP Registry
        if: steps.exists.outputs.skip != 'true'
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  mcpb:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write  # upload the release asset
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install
      - name: Build .mcpb bundle
        run: bun run mcpb
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "metabase-mcp-${TAG#v}.mcpb" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: mcpb
          path: metabase-mcp-*.mcpb

  smithery:
    # Needs a Smithery API key in the repo secret SMITHERY_API_KEY (smithery.ai → account → API keys).
    # Optional repo variable SMITHERY_SERVER_NAME (default serdnaley/metabase-mcp).
    needs: mcpb
    runs-on: ubuntu-latest
    env:
      SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
      SMITHERY_SERVER_NAME: ${{ vars.SMITHERY_SERVER_NAME || 'serdnaley/metabase-mcp' }}
    steps:
      - name: Skip without a Smithery API key
        if: env.SMITHERY_API_KEY == ''
        run: echo "::notice::SMITHERY_API_KEY is not set, skipping Smithery"
      - uses: actions/setup-node@v4
        if: env.SMITHERY_API_KEY != ''
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        if: env.SMITHERY_API_KEY != ''
        with:
          name: mcpb
      - name: Publish the bundle to Smithery
        if: env.SMITHERY_API_KEY != ''
        run: npx -y "$SMITHERY_CLI" mcp publish "metabase-mcp-${TAG#v}.mcpb" -n "$SMITHERY_SERVER_NAME"

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: metabase-mcp:smoke
      - name: Smoke test (HTTP /health)
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 3333:3333 \
            -e METABASE_URL=http://example.invalid -e METABASE_API_KEY=dummy \
            -e MCP_HTTP_TOKEN=smoke-test-token-0123456789 metabase-mcp:smoke
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3333/health; then echo; docker rm -f smoke; exit 0; fi
            sleep 1
          done
          docker logs smoke; exit 1
      - name: Push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/serdnaley/metabase-mcp:${{ env.VERSION }}
            ghcr.io/serdnaley/metabase-mcp:latest
